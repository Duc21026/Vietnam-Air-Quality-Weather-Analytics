# Monitoring location settings for ingestion (OpenAQ)
# Verified 2026-10-06 with `python research/check_openaq.py --probe` (OpenAQ API v3).
# Fields: city, location_id, location_name, coordinates, sensors, parameters

cities:
  - city: Hanoi
    country: VN
    locations:
      - location_id: 4946813
        location_name: "Số 1 đường Giải Phóng - phường Bạch Mai - ĐHBK"
        coordinates:
          latitude: 21.0052
          longitude: 105.8418
        sensors:
          - sensor_id: 13502154
            parameter: pm25
            unit: "µg/m³"
          - sensor_id: 13502152
            parameter: pm10
            unit: "µg/m³"
        parameters:
          - pm25
          - pm10
        first_observation_utc: "2025-07-03T15:40:00Z"
        last_observation_utc: "2026-10-06T07:35:00Z"

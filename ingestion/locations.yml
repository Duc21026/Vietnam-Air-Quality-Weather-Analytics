      - location_id: 6123215
        location_name: OceanPark
        coordinates:
          latitude: 20.9933
          longitude: 105.9441
        sensors:
          - sensor_id: 14581375
            parameter: pm25
            unit: "µg/m³"
        parameters:
          - pm25
        first_observation_utc: "2025-11-08T06:00:00Z"
        last_observation_utc: "2026-10-06T07:00:00Z"

  - city: Ho Chi Minh City
    country: VN
    locations:
      - location_id: 3276359
        location_name: CMT8
        coordinates:
          latitude: 10.78533
          longitude: 106.67029
        sensors:
          - sensor_id: 11357424
            parameter: pm25
            unit: "µg/m³"
        parameters:
          - pm25
        first_observation_utc: "2024-11-19T11:00:00Z"
        last_observation_utc: "2026-10-06T07:00:00Z"
        notes: Active PM2.5. PM10 sensor 11357395 exists but reports no
          recent hourly values, so PM10 is excluded for HCMC.

# Weather settings (Open-Meteo), one point per city
weather_variables:
  - temperature
  - relative_humidity
  - precipitation
  - wind_speed
  - surface_pressure

time_granularity: hourly
